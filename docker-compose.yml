services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/config:/config
      - ${LOCAL_WORKSPACE_FOLDER:-.}/custom_components:/config/custom_components
    ports:
      - "8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
