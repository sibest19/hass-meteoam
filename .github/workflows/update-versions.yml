name: Update Version History

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Switch to history branch
        run: |
          git checkout version-history || git checkout -b version-history

      - name: Generate files
        run: python .github/scripts/generate_versions.py

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add history.json versions.md adoption_trend.svg
          git commit -m "Update version history" || exit 0
          git push origin version-history --force
