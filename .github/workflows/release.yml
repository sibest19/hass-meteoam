name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump_override:
        description: "Override bump type (auto = detect from commits)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - build
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare release
        id: prep
        run: |
          BUMP="${{ inputs.bump_override }}"
          if [ "$BUMP" = "auto" ]; then
            python .github/scripts/prepare_release.py
          else
            python .github/scripts/prepare_release.py "$BUMP"
          fi

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.prep.outputs.release_notes }}
        run: |
          VERSION="${{ steps.prep.outputs.new_version }}"
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Clean up any leftover branch/PR from a previous run
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --delete-branch
          else
            git push origin --delete "$BRANCH" 2>/dev/null || true
          fi

          git checkout -b "$BRANCH"
          git add custom_components/meteoam/manifest.json pyproject.toml
          git commit -m "release: v${VERSION}"
          git push origin "$BRANCH"

          printf '%s' "$RELEASE_NOTES" > release_notes.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: v${VERSION}" \
            --body-file release_notes.md
