---
name: Test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    name: Pytest (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.2.0"
            python: "3.13"
          - homeassistant: "2026.10.4"
            python: "3.14"
          - homeassistant: "2026.11.0"
            python: "3.14"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv venv --python '${{ matrix.python }}'

      - name: Install target Home Assistant and tests
        run: |
          uv export --locked --only-group test --no-hashes --no-emit-project --output-file /tmp/meteoam-test-requirements.txt
          uv pip install -r /tmp/meteoam-test-requirements.txt 'homeassistant==${{ matrix.homeassistant }}'

      - name: Verify target version and dependencies
        env:
          EXPECTED_HA_VERSION: ${{ matrix.homeassistant }}
        run: |
          uv pip check
          .venv/bin/python -c 'import os; from importlib.metadata import version; actual = version("homeassistant"); print("Home Assistant", actual); assert actual == os.environ["EXPECTED_HA_VERSION"]'

      - name: Run tests
        run: .venv/bin/python -m pytest tests/
