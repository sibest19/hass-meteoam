name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump_override:
        description: "Override bump type (auto = detect from commits)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - build
          - minor
          - major
      prerelease:
        description: "Create a pre-release instead of a stable release"
        required: false
        type: choice
        default: none
        options:
          - none
          - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install

      - name: Prepare release
        id: prep
        run: |
          BUMP="${{ inputs.bump_override }}"
          PRERELEASE="${{ inputs.prerelease }}"
          ARGS=""
          if [ "$BUMP" != "auto" ]; then
            ARGS="$BUMP"
          fi
          if [ "$PRERELEASE" != "none" ]; then
            ARGS="$ARGS --prerelease $PRERELEASE"
          fi
          python .github/scripts/prepare_release.py $ARGS

      - name: Update lockfile
        run: uv lock

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.prep.outputs.release_notes }}
        run: |
          VERSION="${{ steps.prep.outputs.new_version }}"
          IS_PRERELEASE="${{ steps.prep.outputs.prerelease }}"
          BRANCH="release/v${VERSION}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            PREFIX="prerelease"
          else
            PREFIX="release"
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Clean up any leftover branch/PR from a previous run
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --delete-branch
          else
            git push origin --delete "$BRANCH" 2>/dev/null || true
          fi

          git checkout -b "$BRANCH"
          git add custom_components/meteoam/manifest.json pyproject.toml uv.lock
          git commit -m "${PREFIX}: v${VERSION}"
          git push origin "$BRANCH"

          printf '%s' "$RELEASE_NOTES" > release_notes.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "${PREFIX}: v${VERSION}" \
            --body-file release_notes.md
